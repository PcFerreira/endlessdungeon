[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="config/*.json,assets/**/*.json,assets/**/*.svg,assets/**/*.txt,assets/**/*.md,assets/**/*.html,assets/**/LICENSE*,assets/**/License*,assets/**/license*,CREDITS.md"
exclude_filter="import_assets/*,tools/*,tests/*,server/*,docs/*,lore/*,artifacts/*,builds/*,.tools/*,.git/*,addons/web_raw_files/*,chat.md,README.md,package.json,package-lock.json,node_modules/*"
export_path="builds/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug="res://.tools/web-templates/4.7.2.stable/web_nothreads_debug.zip"
custom_template/release="res://.tools/web-templates/4.7.2.stable/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://tools/web_shell.html"
html/head_include="<link rel=\"license\" href=\"credits.html\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
